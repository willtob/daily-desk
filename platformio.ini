; pioarduino platform provides Arduino-ESP32 3.x with ESP-IDF 5.x support.
; The standard espressif32 platform only ships Arduino-ESP32 2.x (IDF 4.4).
[env:news_349]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8 — QIO flash, OPI PSRAM
board_build.mcu               = esp32s3
board_build.f_cpu             = 240000000L
board_build.flash_size        = 16MB
board_build.flash_mode        = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions        = default_16MB.csv

board_upload.flash_size       = 16MB
board_upload.maximum_size     = 16777216
board_upload.speed            = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Project-local lv_conf.h takes precedence over the library copy
    -DLV_CONF_INCLUDE_SIMPLE
    ; Include paths — order matters: project first, then library
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/src/drv/axs15231b
    -I${PROJECT_DIR}/src/drv/lcd_bl_bsp
    -I${PROJECT_DIR}/src/drv/touch
    -I${PROJECT_DIR}/src/drv/tca9554
    ; LVGL 8 source root (so #include "lvgl.h" and #include "demos/..." resolve)
    -I${PROJECT_DIR}/../Arduino_Libraries/lvgl8/lvgl

; PlatformIO finds the lvgl library in the lvgl8/ folder (has library.json)
lib_extra_dirs =
    ${PROJECT_DIR}/../Arduino_Libraries/lvgl8

; Port is left to auto-detection, which matches the board by USB VID:PID
; (303a:1001) and picks correctly whenever the board is actually plugged in.
; Do NOT set `upload_port = /dev/cu.usbmodem*` — the value is handed to
; esptool verbatim, globs are not expanded, and every upload then fails with
; "port is busy or doesn't exist". If the board is unplugged, auto-detection
; falls back to whatever serial device exists (a Bluetooth speaker, here) and
; reports "No serial data received" — that means *board missing*, not a fault.

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
