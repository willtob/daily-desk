[project]
name = "esp-news-reporter"
version = "0.1.0"
description = "Personalized tech news digest — a LangGraph pipeline that scores RSS articles against personal interests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "langgraph>=1.2.8",
    "langsmith>=0.10.0",
    "numpy>=2.4.6",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
esp-ingest = "esp_news.cli:ingest_main"
esp-dedup = "esp_news.cli:dedup_main"
esp-score = "esp_news.cli:score_main"
esp-curate = "esp_news.cli:curate_main"
esp-summarize = "esp_news.cli:summarize_main"
esp-digest = "esp_news.cli:digest_main"
esp-serve = "esp_news.cli:serve_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp_news"]
